name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Syntax check every script
        # tools/ is part of the shipped surface (word_accept.py is the acceptance
        # harness), so it gets the same floor as scripts/ and tests/.
        run: python -m compileall -q scripts tests tools

      - name: Reject syntax newer than the minimum supported Python
        # compileall uses the interpreter at hand, so on 3.12 a PEP 701
        # f-string (backslash inside an expression) compiles fine and only
        # breaks on 3.10. Parse with feature_version pinned to the floor
        # instead, so the whole matrix agrees.
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = 0
          files = []
          for d in ("scripts", "tests", "tools"):
              files += sorted(pathlib.Path(d).glob("*.py"))
          for p in files:
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p), feature_version=(3, 10))
              except SyntaxError as e:
                  print(f"::error file={p},line={e.lineno}::{e.msg}")
                  bad += 1
          print(f"checked {len(files)} files, failures={bad}")
          sys.exit(1 if bad else 0)
          PY

      - name: requirements.txt must be pure ASCII
        # pip reads this file with the system locale encoding. An em dash or any
        # other non-ASCII byte breaks `pip install -r` on a CJK Windows (cp936)
        # while passing on ubuntu (UTF-8) and windows-latest (cp1252) -- a bug
        # the matrix cannot otherwise catch.
        shell: bash
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' requirements.txt; then
            echo "::error file=requirements.txt::non-ASCII byte found; pip will fail on cp936"
            exit 1
          fi
          echo "requirements.txt is ASCII-only"

      - name: Every CLI answers --help
        shell: bash
        run: |
          set -e
          fail=0
          for f in scripts/*.py; do
            case "$(basename "$f")" in
              _*|docx_common.py|docx_utils.py|encoding_fix.py|linear_to_latex.py|math_omml.py|docx_pack.py) continue ;;
            esac
            echo "--- $f"
            python "$f" --help > /dev/null || { echo "FAILED: $f"; fail=1; }
          done
          exit $fail

      - name: Run tests
        # Formula round-trip tests need MML2OMML.XSL from a local Office install,
        # which the hosted runners do not have. Those tests skip themselves when
        # the stylesheet is absent; everything else must pass.
        run: python -m pytest tests/ -v

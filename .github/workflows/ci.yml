name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Syntax check every script
        # tools/ is part of the shipped surface (word_accept.py is the acceptance
        # harness), so it gets the same floor as scripts/ and tests/.
        run: python -m compileall -q scripts tests tools

      - name: Reject syntax newer than the minimum supported Python
        # compileall uses the interpreter at hand, so on 3.12 a PEP 701
        # f-string (backslash inside an expression) compiles fine and only
        # breaks on 3.10. Parse with feature_version pinned to the floor
        # instead, so the whole matrix agrees.
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = 0
          files = []
          for d in ("scripts", "tests", "tools"):
              files += sorted(pathlib.Path(d).glob("*.py"))
          for p in files:
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p), feature_version=(3, 10))
              except SyntaxError as e:
                  print(f"::error file={p},line={e.lineno}::{e.msg}")
                  bad += 1
          print(f"checked {len(files)} files, failures={bad}")
          sys.exit(1 if bad else 0)
          PY

      - name: requirements.txt must be pure ASCII
        # pip reads this file with the system locale encoding. An em dash or any
        # other non-ASCII byte breaks `pip install -r` on a CJK Windows (cp936)
        # while passing on ubuntu (UTF-8) and windows-latest (cp1252) -- a bug
        # the matrix cannot otherwise catch.
        shell: bash
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' requirements.txt; then
            echo "::error file=requirements.txt::non-ASCII byte found; pip will fail on cp936"
            exit 1
          fi
          echo "requirements.txt is ASCII-only"

      - name: Every CLI answers --help
        # Why this step is not the two lines it used to be. Three ways the old
        # version was decorative rather than protective:
        #
        #   1. FALSE GREEN. `python "$f" --help > /dev/null || fail=1` only sees
        #      the exit code. minidom_compat.py is a pure library (no argparse,
        #      no __main__), so it printed nothing and exited 0 -- and the gate
        #      that was meant to prove "this is a working CLI" proved nothing at
        #      all. Silence now counts as failure.
        #   2. MISSED COVERAGE. docx_common.py does expose a real CLI but was
        #      hardcoded into the skip list, so the one gate covering CLIs
        #      never looked at it. (It is now in `checked` like every other CLI.
        #      Its earlier `--api` special case is gone too: that existed only
        #      because docx_common.py was the one CLI without the `import
        #      _bootstrap` UTF-8 stdio fix, which made `--help` die on cp1252.
        #      The import was added, so `--help` is now platform-invariant.)
        #   3. HARDCODED LIST. The skip list was six filenames while the tree
        #      actually ships seven pure libraries (_bootstrap.py was only
        #      excluded by the `_*` glob). The next library added would have
        #      been silently dragged into the loop and turned the build red, or
        #      the next CLI deleted would have gone unnoticed.
        #
        # NOTE on the current split: the pure libraries that ship a one-line
        # `__main__` self-description (docx_pack / docx_utils / encoding /
        # linear_to_latex / math_omml / minidom_compat) are classified as CLIs
        # by rule B, and deliberately so -- they now answer `--help` with a real
        # message, which is exactly what this gate should confirm. Only
        # _bootstrap.py remains in the library bucket, via rule A.
        #
        # The list is now derived, the two rules are unioned, and the derived
        # set is cross-checked against an independent probe so drift fails loudly.
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          # --- derived classification -------------------------------------
          # Rule A (`_*`): private modules are imported by the CLIs before
          #   argument parsing, so executing them is never meaningful.
          # Rule B (no `__main__` guard): a module that cannot run itself
          #   cannot be a CLI, so `--help` cannot validate it either.
          # The two rules are UNIONED. Rule B alone would drag _bootstrap.py
          # into the loop (it is a pure library too, and it prints nothing).
          is_pure_lib() {
            case "$(basename "$1")" in _*) return 0 ;; esac
            ! grep -qE '^[[:space:]]*if[[:space:]]+__name__[[:space:]]*==' "$1"
          }

          # Independent probe of the same intent, used only for the cross-check.
          # Deliberately a different (looser) expression than the anchored grep
          # in is_pure_lib: if either side drifts, the diff below fires.
          probed=$(grep -L 'if __name__' scripts/*.py || true)

          skipped=()
          checked=()
          for f in scripts/*.py; do
            if is_pure_lib "$f"; then skipped+=("$f"); else checked+=("$f"); fi
          done

          if [ "${#checked[@]}" -eq 0 ]; then
            echo "::error::no CLI scripts found under scripts/ -- the gate would verify nothing"
            exit 1
          fi

          # --- consistency self-check (both directions) --------------------
          # Direction 1: anything the probe calls a library must be excluded.
          # If not, it is "checked" by a gate that cannot detect its silence.
          for f in $probed; do
            is_pure_lib "$f" || {
              echo "::error file=$f::$f has no __main__ but is NOT excluded; the probe and the exclusion list disagree"
              fail=1
            }
          done
          # Direction 2: anything excluded must be justified by `_*` or the probe.
          # This is what catches a hardcoded filename creeping back in.
          for f in "${skipped[@]}"; do
            case "$(basename "$f")" in _*) continue ;; esac
            printf '%s\n' "$probed" | grep -qxF "$f" || {
              echo "::error file=$f::$f is excluded but has a __main__ guard; exclusion is not justified by the rules"
              fail=1
            }
          done

          echo "pure libraries (excluded, ${#skipped[@]}):"
          for f in "${skipped[@]}"; do echo "  $f"; done
          echo "CLIs (checked, ${#checked[@]}):"
          for f in "${checked[@]}"; do echo "  $f"; done

          # --- the gate itself ---------------------------------------------
          # Non-empty output is required: a silent exit 0 is exactly the
          # false green this step exists to prevent.
          #
          # Every script in `checked` gets the same `--help` probe. There used
          # to be a per-file exception for docx_common.py, which had to be
          # probed with `--api` because it was the only CLI without the
          # `import _bootstrap` UTF-8 stdio fix: its argparse epilog is Chinese,
          # so on a leg whose redirected stdout is cp1252 (windows-latest)
          # `--help` died with UnicodeEncodeError. That gap is now closed --
          # docx_common.py imports _bootstrap like every other CLI -- so the
          # exception is gone and the gate is uniformly stricter. Re-measured
          # both ways under PYTHONIOENCODING=cp1252: `--help` exits 0.
          for f in "${checked[@]}"; do
            arg=--help
            out=$(mktemp)
            echo "--- $f $arg"
            if ! python "$f" "$arg" > "$out" 2>&1; then
              echo "::error file=$f::python $f $arg exited non-zero"
              fail=1
            elif [ ! -s "$out" ]; then
              echo "::error file=$f::$f $arg produced no output (silent exit 0 proves nothing)"
              fail=1
            else
              head -n 1 "$out"
            fi
            rm -f "$out"
          done

          exit $fail

      - name: Run tests
        # Formula round-trip tests need MML2OMML.XSL from a local Office install,
        # which the hosted runners do not have. Those tests skip themselves when
        # the stylesheet is absent; everything else must pass.
        #
        # Exit code alone is not enough: pytest exits 0 when a whole block of
        # tests has been turned into skips. The gate below judges a *property*
        # of the run instead of a pair of snapshot numbers (P5-AUDIT-QUALITY
        # section 4, "the gate verifies a count, not a surface").
        #
        # THE GATE -- four checks, no snapshot arithmetic:
        #
        #   1. FAILURES ARE NEVER ALLOWED.  failed == 0 and errors == 0.
        #
        #   2. IDENTITY: every collected test must be accounted for.
        #        passed + skipped + failed + errors + xfailed + xpassed == collected
        #      `collected` comes from a separate `--collect-only` process, i.e.
        #      from pytest's own collector rather than from the run being judged.
        #      A test that is collected but never reported -- dropped by a
        #      conftest change, lost to a bad selector, silently not imported --
        #      breaks the identity. With nothing failing and no xfail in the
        #      suite this reduces to the plain `passed + skipped == collected`.
        #
        #   3. FLOOR: passed >= MIN_PASSED (1440, measured on a clean clone with no
        #      Office; see the arithmetic below). Monotone: it only ever moves
        #      up, so tests that really execute can never quietly stop
        #      executing. This is also what catches a single pass -> skip flip,
        #      which the identity cannot see (moving one test between two
        #      buckets preserves the total).
        #
        #   4. SKIP RATIO CEILING: skipped <= collected / 4 (25%).
        #      A ratio, not a count: adding a new test that skips on CI (no
        #      Office on the runner) can no longer force a false red, while a
        #      whole category of tests degrading into skips still trips it.
        #      Today 375/1815 = 20.7%, i.e. about 78 slots of slack.
        #
        # What replaced what, and why (P5-AUDIT-QUALITY 4.1-4.3 and 10 item 8):
        #   MIN_PASSED was 1356 when this gate was written (P5). It was never the
        #     problem: it is a monotone floor and its zero headroom is the point
        #     of it. The P6 batch added 88 tests that really run on the runner,
        #     so following this file's own rule the floor moved to 1440.
        #     The first attempt at that moved it to 1441 and went red on all four
        #     legs: the simulation had been run inside the development tree,
        #     whose parent directory contains `_smoke/`, so one test passed
        #     there and skips on a runner. Simulate on a clean clone.
        #   MAX_SKIPPED = 372 (371 measured + 1 headroom) is deleted. A
        #     one-test headroom is a snapshot: every new skip-on-CI test turned
        #     all four legs red and demanded a magic-number edit in the same
        #     commit -- the audit's "false red" finding. The ratio ceiling
        #     replaces it. The single pass -> skip flip the old ceiling caught
        #     immediately is now caught by the floor (check 3), because `passed`
        #     sits on that floor: the floor is a measurement, not slack.
        #
        # The numbers are the hosted-runner reality, not this workstation.
        # P6 measurement (2026-11-11, after the P6 fix batch; this is the
        # current truth, four legs agree): 1440 passed / 375 skipped / collected 1815.
        # Measure it on a clone of this repository, not inside the development
        # tree -- see the `_smoke/` note above.
        # P5 measurement (historical, do not use as the floor):
        #   passed 1356 / skipped 371 / collected 1727.
        # Re-measured on a simulated runner after the P5 round landed
        # (no Office -> no MML2OMML.XSL, no _smoke/ in the parent dir, no
        # work/r7_final/): 1356 passed / 371 skipped / collect 1727.
        # A developer machine with Office reports 1576 passed / 239 skipped on
        # the same collect 1815 (P6 numbers; before P6 it was 1488 / 239 on
        # collect 1727) -- the ~135 extra passes are the OMML-dependent tests
        # flipping back to pass. Do NOT use that number here.
        #
        # How the floor is built, so the next person can audit it instead of
        # just bumping it:
        #   A1 baseline (before RT-001/002/007/008/009)      1293 / 359
        #   + RT-009 test_fonts.py   9 -> 13 tests           +4  /   0   (they run
        #                                            without Office: no OMML)
        #   + RT-002 test_insert_formula.py 6 tests          +0  /  +6   (all six
        #                                            skip without the XSL)
        #   = P3-4 baseline                                  1297 / 365
        #   + P5-A2 test_docx_edit_subcommands.py 38 tests  +38 /   0   (docx_edit
        #                                            imports no OMML module at all,
        #                                            so all 38 really run)
        #   + P5-A1 test_insert_formula.py 6 more tests      +0  /  +6   (same
        #                                            reason as RT-002 above)
        #   + P5 P0  test_docx_pack_safety.py 14 tests      +14 /   0
        #   + P5 P0  test_docx_template_output.py 7 tests    +7 /   0   (neither
        #                                            file touches the OMML chain)
        #   =                                                1356 / 371   (P5)
        #   + P6 batch (9 test files touched, +88 tests total)  +85 /  +3
        #        measured aggregate only -- the per-file split was not
        #        verified one by one, so it is deliberately not written here.
        #        The +3 skips are tests that need the XSL at run time.
        #   =                                                1440 / 375  (P6)
        #
        # Adding tests from now on (details in docs/reports/P6-FIX-C4.md):
        #   new test that RUNS on the runner  -> raise MIN_PASSED to the freshly
        #                                        measured `passed`. Nothing else.
        #   new test that SKIPS on the runner -> change nothing at all: the
        #                                        identity follows `collected` and
        #                                        the ratio ceiling has slack.
        #   either way, do not reintroduce a skipped-count constant.
        shell: bash
        run: |
          set -uo pipefail
          log=$(mktemp)          # not ./pytest.log: keep the checkout clean
          collect_log=$(mktemp)
          python -m pytest tests/ --tb=short -q > "$log" 2>&1
          status=$?
          tail -n 30 "$log"
          if [ "$status" -ne 0 ]; then
            rm -f "$log" "$collect_log"
            echo "::error::pytest exited $status"
            exit 1
          fi
          # The identity needs an independent denominator, so ask pytest's own
          # collector -- in a separate process -- how many tests exist at all.
          python -m pytest tests/ --collect-only -q > "$collect_log" 2>&1
          cstatus=$?
          if [ "$cstatus" -ne 0 ]; then
            rm -f "$log" "$collect_log"
            echo "::error::--collect-only exited $cstatus; cannot establish the identity denominator"
            exit 1
          fi
          python - "$log" "$collect_log" <<'PY'
          import pathlib, re, sys

          MIN_PASSED = 1440                        # monotone floor, measured on a clean clone
          SKIP_RATIO_NUM, SKIP_RATIO_DEN = 1, 4    # skipped <= collected / 4

          run_log = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          collect_log = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")

          # The summary is the last line carrying a duration, e.g.
          #   "1440 passed, 375 skipped, 5 warnings in 61.23s"
          summary = None
          for line in run_log.splitlines():
              if re.search(r"\bin\s+\d+(?:\.\d+)?s", line) and re.search(r"\d+ (?:passed|failed|error)", line):
                  summary = line
          if summary is None:
              print("::error::no pytest summary line found; cannot verify the counts")
              sys.exit(1)
          print(f"summary: {summary.strip()}")

          def count(word):
              m = re.search(r"(\d+) " + word, summary)
              return int(m.group(1)) if m else 0

          passed, skipped = count("passed"), count("skipped")
          failed, errors = count("failed"), count("errors?")
          xfailed, xpassed = count("xfailed"), count("xpassed")

          collected = None
          for line in collect_log.splitlines():
              m = re.match(r"(\d+) tests? collected", line.strip())
              if m:
                  collected = int(m.group(1))
          if collected is None:
              print("::error::no 'N tests collected' line in the --collect-only output; "
                    "cannot verify the identity")
              sys.exit(1)
          print(f"collected={collected} (from --collect-only)")

          accounted = passed + skipped + failed + errors + xfailed + xpassed
          ceiling = collected * SKIP_RATIO_NUM // SKIP_RATIO_DEN
          bad = 0

          if failed or errors:
              print(f"::error::{failed} failed / {errors} error -- failures are never allowed")
              bad = 1
          if accounted != collected:
              print(
                  f"::error::identity broken: passed({passed}) + skipped({skipped}) + failed({failed})"
                  f" + errors({errors}) + xfailed({xfailed}) + xpassed({xpassed}) = {accounted},"
                  f" but --collect-only collected {collected}."
                  f" {collected - accounted} test(s) were collected and never reported;"
                  f" a test that cannot run is not a test that passed"
              )
              bad = 1
          if passed < MIN_PASSED:
              print(
                  f"::error::passed={passed} is below the floor {MIN_PASSED}; tests stopped"
                  f" executing (deleted, or flipped from pass to skip). The floor only moves up"
              )
              bad = 1
          if skipped * SKIP_RATIO_DEN > collected * SKIP_RATIO_NUM:
              print(
                  f"::error::skipped={skipped} is over {ceiling} (collected={collected} /"
                  f" {SKIP_RATIO_DEN}); a whole category of tests stopped running"
              )
              bad = 1

          ratio = (100.0 * skipped / collected) if collected else 0.0
          print(
              f"passed={passed} (>= {MIN_PASSED}) | skipped={skipped} (<= {ceiling} ="
              f" {ratio:.1f}% of {collected}) | failed={failed} errors={errors}"
              f" | accounted={accounted} vs collected={collected}"
          )
          sys.exit(1 if bad else 0)
          PY
          # Re-exit with the parser's status: a trailing `rm` would otherwise
          # become the step's exit code and mask a real failure.
          rc=$?
          rm -f "$log" "$collect_log"
          exit $rc
